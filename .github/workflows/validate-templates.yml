name: validate-templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: ruby scripts/check-templates.rb
