name: 설계·구조 제안
description: 구조·설계·방향을 바꾸자는 제안. 결정이 필요한 논의에 씁니다.
title: "[제안] "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        "무엇을 하자"와 함께 "왜"를 꼭 적어 주세요. 이유가 있어야 다른 사람이 대안을 낼 수 있습니다.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 무엇을 바꾸자는 것인지 한두 줄로 적습니다.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 지금 문제
      description: 지금 무엇이 불편하거나 위험한지, 가능하면 사례나 수치와 함께 적습니다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 구체적으로 무엇을 어떻게 바꾸는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 이렇게 하는가
      description: 이 방법을 고른 이유와 근거 문서(설계서·정의서 등)를 적습니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 다른 방법을 버린 이유도 함께 적습니다.
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 바뀌는 저장소·코드·진행 중인 작업, 되돌리기 쉬운지 어려운지를 적습니다.
  - type: textarea
    id: decisions
    attributes:
      label: 정해야 할 것
      description: 누가 무엇을 정해야 하는지 목록으로 적습니다.
