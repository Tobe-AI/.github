name: 버그 신고
description: 기대와 다르게 동작하는 것을 알립니다.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        공개 이슈에는 토큰, 자격 증명, 개인정보, 고객 자료나 내부 원본 로그를 올리지 마세요.
        보안 취약점이 의심되면 이 양식을 제출하지 말고, 프로젝트에서 안내한 비공개 신고 경로를 사용하세요.
        경로가 안내되지 않았다면 세부 내용을 공개하지 말고 담당자에게 비공개 연락 방법을 먼저 확인하세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 생겼나
      description: 실제로 본 것과 영향 범위를 적습니다. 오류 메시지는 민감한 값을 제거하고 필요한 부분만 넣습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일으키는 방법
      description: 다른 사람이 확인할 수 있는 최소 단계만 적습니다. 필요하면 익명화하거나 가상 데이터로 바꾼 입력·설정을 덧붙입니다.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전·커밋
      description: 브랜치 이름이나 커밋 해시를 적습니다.
  - type: textarea
    id: env
    attributes:
      label: 환경
      description: 재현에 필요한 버전·운영체제·실행 환경만 적습니다. 내부 호스트 이름이나 장비 식별자는 생략합니다.
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 작업이 막힘
        - 우회할 수 있음
        - 사소함
    validations:
      required: true
