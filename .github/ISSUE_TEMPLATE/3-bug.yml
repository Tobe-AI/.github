name: 버그 신고
description: 기대와 다르게 동작하는 것을 알립니다.
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 생겼나
      description: 실제로 본 것을 적습니다. 오류 메시지는 그대로 붙여 넣습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일으키는 방법
      description: 순서대로 적습니다. 명령, 입력 파일, 설정을 포함합니다.
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전·커밋
      description: 브랜치 이름이나 커밋 해시를 적습니다.
  - type: textarea
    id: env
    attributes:
      label: 환경
      description: 운영체제, 실행 위치(로컬·서버·현장 장비), 관련 설정을 적습니다.
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 작업이 막힘
        - 우회할 수 있음
        - 사소함
    validations:
      required: true
